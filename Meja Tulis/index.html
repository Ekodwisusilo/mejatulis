<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meja Tulis</title>
<meta name="description" content="Catat tulisan, kejar tenggat lomba, dan pantau tiap tahapnya. Data tersimpan di perangkatmu.">
<meta name="theme-color" content="#eef1f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1719" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">

  <nav aria-label="Navigasi">
    <button data-v="dash" aria-current="true">Dashboard</button>
    <button data-v="pieces">Tulisan</button>

<div id="banner" role="status" hidden></div>
<main id="main"><noscript><div class="empty">Meja Tulis butuh JavaScript. Aktifkan JavaScript di peramban ini.</div></noscript></main>
<div class="sec"><span class="meta" id="foot-status">Data tersimpan di perangkat ini.</span>

</div>
<dialog id="dlg"></dialog>
<div id="toasts" aria-live="polite"></div>
<input type="file" id="file" accept="application/json,.json" hidden>
